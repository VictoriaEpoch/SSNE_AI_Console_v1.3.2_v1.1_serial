name: Build current Windows EXE

on:
  push:
    branches:
      - agent/build-exe-20260726
  pull_request:
    branches:
      - 第三版
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore uploaded source changes
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build/runtime.patch.gz.b64.*' | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 patch parts, found $($parts.Count)" }
          $encoded = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $compressed = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes('runtime.patch.gz', $compressed)
          $input = [IO.File]::OpenRead('runtime.patch.gz')
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create('runtime.patch')
          $gzip.CopyTo($output)
          $output.Dispose()
          $gzip.Dispose()
          $input.Dispose()
          git apply --whitespace=nowarn runtime.patch
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Verify current source compiles
        run: python -m compileall -q main.py app

      - name: Build single-file GUI EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SSNE_AI_Console_v1.3.2 main.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/SSNE_AI_Console_v1.3.2.exe'
          if ($exe.Length -lt 1000000) { throw "Generated EXE is unexpectedly small: $($exe.Length) bytes" }
          Get-FileHash $exe.FullName -Algorithm SHA256
          $exe | Format-List Name,Length,LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: SSNE_AI_Console_v1.3.2_Windows
          path: dist/SSNE_AI_Console_v1.3.2.exe
          if-no-files-found: error
          retention-days: 7
